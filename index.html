<!DOCTYPE html>
<html>
<head>
  <title>JWPlayer Custom Ad Detector</title>
  <script src="https://cdn.jwplayer.com/libraries/aVr2lJgW.js"></script>
</head>
<body>

<div id="player"></div>

<script>
const customVastTag = "https://your-ad-server.com/vast.xml"; // ✅ Your VAST URL here

let adPlaying = false;

// 🧠 Helper to detect ad segment patterns
function isAdSegment(url) {
  return url.includes("/beacon/") || url.includes("seen-ad=1") || url.includes("redirect_url=");
}

// ✅ JWPlayer setup
const player = jwplayer("player").setup({
  file: "https://amg02159-kcglobal-amg02159c1-samsung-in-521.playouts.now.amagi.tv/playlist/amg02159-kcglobal-animax-samsungin/playlist.m3u8",
  autostart: true,
  mute: false,
  width: "100%",
  height: "100%",
  type: "hls",
  advertising: {
    client: "vast",
    tag: "", // leave empty so you can trigger manually via playAd()
    skipoffset: 0
  }
});

// 🔁 Listen for each HLS fragment load (i.e. .ts segment request)
player.on("fragmentLoad", function (e) {
  const url = e.fragment && e.fragment.url;

  if (url && isAdSegment(url) && !adPlaying) {
    adPlaying = true;

    console.log("🚨 Ad segment detected:", url);

    // Pause content
    player.pause();

    // Trigger your own ad
    player.playAd(customVastTag)
      .then(() => {
        console.log("✅ VAST ad completed");
        adPlaying = false;
        player.play();
      })
      .catch(err => {
        console.error("❌ VAST ad failed", err);
        adPlaying = false;
        player.play();
      });
  }
});
</script>

</body>
</html>
