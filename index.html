<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JWPlayer Dynamic URL Player</title>
    <link rel="stylesheet" href="https://cdn-jwplayer.netlify.app/style.css" />
    <meta name="robots" content="noindex, nofollow" />
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"
        integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .wrap {
            max-width: 800px;
            margin: 20px auto;
        }

        #urlForm {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        #videoURL {
            flex-grow: 1;
            padding: 10px;
            font-size: 1rem;
            border-radius: 4px;
            border: none;
            outline: none;
        }

        #playBtn {
            padding: 10px 20px;
            background: #e50914;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #playBtn:hover {
            background: #b0060f;
        }

        #player {
            width: 100%;
            height: 450px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="wrap">
        <form id="urlForm">
            <input type="text" id="videoURL" placeholder="Paste M3U8 or MP4 URL here" required />
            <button type="submit" id="playBtn">Play</button>
        </form>

        <div id="player"></div>
    </div>

    <script src="https://cdn.jwplayer.com/libraries/aVr2lJgW.js"></script>
    <script>
        // Initialize JWPlayer with a default video
        let playerInstance = jwplayer("player").setup({
            controls: true,
            displaytitle: true,
            displaydescription: false,
            abouttext: "RyuuStream",
            aboutlink: "https://animezia.com",
            autostart: false,
            skin: {
                name: "netflix"
            },
            playlist: [{
                title: "Default Video",
                sources: [{
                    file: "https://cdn-jwplayer.netlify.app/eren.mp4"
                }]
            }],
        });

        // Form submit handler
        $("#urlForm").on("submit", function (e) {
            e.preventDefault();
            const url = $("#videoURL").val().trim();

            if (!url) {
                alert("Please enter a video URL.");
                return;
            }

            // Basic validation for file types (m3u8 or mp4)
            if (!url.match(/\.(m3u8|mp4)(\?.*)?$/i)) {
                alert("Please enter a valid M3U8 or MP4 URL.");
                return;
            }

            // Load the new video into the player
            playerInstance.load([{
                file: url
            }]);
            playerInstance.play();

        });
    </script>

</body>

</html>
