<video id="video" controls autoplay muted playsinline style="width: 100%; max-width: 800px;"></video>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
const video = document.getElementById("video");
const hls = new Hls();

hls.loadSource("https://amg02159-kcglobal-amg02159c1-samsung-in-521.playouts.now.amagi.tv/playlist/amg02159-kcglobal-animax-samsungin/playlist.m3u8");
hls.attachMedia(video);

// Track when last ad was played
let adCooldown = false;

hls.on(Hls.Events.FRAG_PARSING_METADATA, function (event, data) {
  data.samples.forEach(sample => {
    const cueData = new TextDecoder().decode(sample.data);
    console.log("📡 SCTE-35 Marker Detected:", cueData);

    // Only play ad if not already triggered recently
    if (!adCooldown) {
      adCooldown = true;
      playAdThenResume();

      // Cooldown prevents multiple triggers for the same break
      setTimeout(() => {
        adCooldown = false;
      }, 60000); // 60 seconds
    }
  });
});

function playAdThenResume() {
  video.pause();

  const adVideo = document.createElement("video");
  adVideo.src = "https://cdn-jwplayer.netlify.app/eren.mp4";
  adVideo.autoplay = true;
  adVideo.controls = false;
  adVideo.playsInline = true;
  adVideo.style = "width: 100%; max-width: 800px;";
  document.body.insertBefore(adVideo, video);
  video.style.display = "none";

  adVideo.addEventListener("ended", () => {
    adVideo.remove();
    video.style.display = "block";
    video.play();
  });
}
</script>
